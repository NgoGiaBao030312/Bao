<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét link Gia Bảo</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h2 {
            color: #ff3b30;
            margin-bottom: 20px;
        }
        .status {
            background-color: #2c2c2e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .device-code {
            font-size: 28px;
            font-weight: bold;
            color: #34c759;
            letter-spacing: 2px;
            margin: 15px 0;
            background: #111;
            padding: 10px;
            border-radius: 6px;
        }
        .btn {
            display: inline-block;
            background-color: #fe2c55;
            color: white;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #e0244d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Quét Link Gia Bảo</h2>
        <div class="status">✅ Thiết bị đã được cấp phép</div>
        <p>Mã thiết bị của bạn:</p>
        <div class="device-code" id="deviceCode">GB01</div>
        <a href="https://www.tiktok.com" class="btn" id="tiktokBtn" target="_blank">MỞ TIKTOK</a>
    </div>

    <script>
        // Tự động tạo mã thiết bị ngẫu nhiên 4 ký tự cho sinh động
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let randomCode = "";
        for (let i = 0; i < 4; i++) {
            randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById("deviceCode").innerText = randomCode;

        // Xử lý nếu có link live truyền vào từ bot (ví dụ: ?url=...)
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');
        if (targetUrl) {
            document.getElementById("tiktokBtn").href = decodeURIComponent(targetUrl);
        }
    </script>

</body>
</html>
